name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected release version, for example 0.1.0
        required: true
        default: "0.1.0"
        type: string
      distribution:
        description: Require production signing and notarization gates
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: decc-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DECC_EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  macos:
    name: macOS release preflight
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate macOS bundle
        run: pnpm release:preflight:macos

      - name: Require distribution signing and Gatekeeper acceptance
        if: github.ref_type == 'tag' || inputs.distribution
        run: pnpm release:verify-signed:macos

      - name: Archive validated macOS bundle
        run: tar -czf "DECC-${DECC_EXPECTED_VERSION}-macos-app.tar.gz" -C src-tauri/target/release/bundle/macos DECC.app

      - name: Upload validated macOS bundle
        uses: actions/upload-artifact@v7
        with:
          path: DECC-${{ env.DECC_EXPECTED_VERSION }}-macos-app.tar.gz
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload installable macOS DMG
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
          archive: false

  windows:
    name: Windows release preflight
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate Windows installer
        run: pnpm release:preflight:windows

      - name: Smoke-test installer lifecycle
        run: pnpm release:smoke:windows

      - name: Require Authenticode distribution signing
        if: github.ref_type == 'tag' || inputs.distribution
        run: pnpm release:verify-signed:windows

      - name: Upload validated Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DECC-${{ env.DECC_EXPECTED_VERSION }}-windows-x64
          path: |
            src-tauri/target/release/decc.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Prepare draft GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*-setup.exe
