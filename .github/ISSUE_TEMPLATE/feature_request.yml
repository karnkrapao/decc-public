name: Feature request
description: Suggest a DECC workflow or product improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the developer workflow or problem you want DECC to improve. Avoid including private project data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What is difficult, repetitive, unclear, or missing today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would a successful DECC experience look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: Optional. How do you handle this today?
